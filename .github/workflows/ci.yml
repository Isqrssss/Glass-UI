name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0
      - name: Install pinned tools
        run: aftman install
      - name: Build ModuleScript with Rojo
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/ModernLiquidGlassLibrary.rbxm
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernLiquidGlassLibrary-rbxm
          path: dist/ModernLiquidGlassLibrary.rbxm
