name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rojo
        uses: rojo-rbx/setup-rojo@v1
        with:
          version: "7.5.1"
      - name: Build release files
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/ModernLiquidGlassLibrary.rbxm
          zip -r dist/ModernLiquidGlassLibrary-source.zip README.md CHANGELOG.md .gitignore aftman.toml default.project.json src examples docs tests .github
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ModernLiquidGlassLibrary.rbxm
            dist/ModernLiquidGlassLibrary-source.zip
