name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0
      - name: Install pinned tools
        run: aftman install
      - name: Build release files
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/ModernLiquidGlassLibrary.rbxm
          zip -r dist/ModernLiquidGlassLibrary-source.zip .github .gitignore aftman.toml default.project.json src examples docs tests
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ModernLiquidGlassLibrary.rbxm
            dist/ModernLiquidGlassLibrary-source.zip
